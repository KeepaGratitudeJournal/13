<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>換個角度看生活 - 心情透視鏡</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #F7FAFC;
      color: #2D3748;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 24px 18px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .title {
      font-size: 26px;
      font-weight: bold;
      color: #2C7A7B;
      text-align: center;
      margin: 6px 0 14px 0;
    }
    .guide-text {
      font-size: 19px;
      line-height: 1.6;
      color: #4A5568;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .tag-btn {
      background: #EDFDFD;
      border: 2px solid #B2F5EA;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 17px;
      line-height: 1.4;
      text-align: center;
      color: #234E52;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      transition: all 0.15s ease-in-out;
    }
    .tag-btn.active {
      background: #319795;
      color: #FFFFFF;
      border-color: #285E61;
      transform: scale(0.98);
    }
    .tag-btn span {
      font-size: 24px;
      margin-bottom: 4px;
    }
    textarea {
      width: 100%;
      height: 80px;
      font-size: 18px;
      padding: 12px;
      border: 2px solid #CBD5E0;
      border-radius: 14px;
      margin-bottom: 14px;
      resize: none;
      font-family: inherit;
    }
    .btn-submit {
      width: 100%;
      background: #319795;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(49, 151, 149, 0.3);
    }
    .btn-submit:disabled { background: #A0AEC0; }
    .result-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      background: #FFFAF0;
      border: 2px solid #FEEBC8;
      display: none;
    }
    .result-title {
      font-size: 21px;
      font-weight: bold;
      color: #C05621;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-content {
      font-size: 20px;
      line-height: 1.7;
      color: #2D3748;
      margin-bottom: 14px;
    }
    .btn-speak {
      background: #ED8936;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="title">👓 心情透視鏡</div>
  <div class="guide-text">
    點選一個最近讓您有點煩心或無奈的事，或在框框內自己寫：
  </div>

  <!-- 8大高齡常見煩惱卡片 -->
  <div class="quick-grid">
    <button class="tag-btn" onclick="selectTag(this, '家人講話口氣很急、很大聲，讓我心裡不舒服')">
      <span>🗣️</span>家人講話急又大聲
    </button>
    <button class="tag-btn" onclick="selectTag(this, '孫子孩子回家都一直看手機，很少跟我講話')">
      <span>📱</span>後輩回家一直滑手機
    </button>
    <button class="tag-btn" onclick="selectTag(this, '身體常常這裡酸那裡痛，覺得年紀大很不中用')">
      <span>🩹</span>身體常常酸痛不適
    </button>
    <button class="tag-btn" onclick="selectTag(this, '晚上常常翻來覆去睡不好，很早就醒過來')">
      <span>🌙</span>晚上容易失眠睡不好
    </button>
    <button class="tag-btn" onclick="selectTag(this, '常常轉頭就忘記東西放哪，擔心自己記性退化')">
      <span>🔑</span>常常忘東忘西找東西
    </button>
    <button class="tag-btn" onclick="selectTag(this, '天氣不好下大雨，只能整天關在家裡好無聊')">
      <span>🌧️</span>下雨天悶在家很無趣
    </button>
    <button class="tag-btn" onclick="selectTag(this, '鄰居或朋友講話酸言酸語，聽了心裡很不開心')">
      <span>💬</span>朋友鄰居講話不好聽
    </button>
    <button class="tag-btn" onclick="selectTag(this, '每天日子好像都差不多，感覺生活沒什麼特別目標')">
      <span>⏳</span>生活平淡沒什麼目標
    </button>
  </div>

  <textarea id="userInput" placeholder="也可以在此自己打字或用語音輸入..."></textarea>

  <button class="btn-submit" id="btnSubmit" onclick="getReframing()">請 AI 助教換角度看 ➔</button>

  <div class="result-box" id="resultBox">
    <div class="result-title">🌟 AI 助教的溫暖發現：</div>
    <div class="result-content" id="resultText"></div>
    <button class="btn-speak" onclick="speakResult()">🔊 唸給我聽</button>
  </div>
</div>

<script>
  const presetReplies = {
    "家人講話口氣很急、很大聲，讓我心裡不舒服": "大哥/大姐，家人講話急躁常常是因為外面工作步調快，或心裡急著想事情，並不是對您有意見。換個角度看，他們有事願意直接對您說，代表在您面前最不偽裝、最放心！",
    "孫子孩子回家都一直看手機，很少跟我講話": "年輕人習慣看手機，但他們願意下課下班後回到您身邊坐著滑，代表在您這裡能感受到放鬆與安全感。換個角度想，默默遞上一盤水果或一杯水，他一定能深刻體會到您的關心！",
    "身體常常這裡酸那裡痛，覺得年紀大很不中用": "酸痛確實很辛苦，但換個角度看，這是身體為您辛勞奉獻了幾十年發出的提醒訊號，告訴您『現在該好好休息、善待自己了』。您走過那麼多風雨，身體依然陪伴著您，非常值得好好感謝它！",
    "晚上常常翻來覆去睡不好，很早就醒過來": "睡不著時容易煩躁，但換個角度看，這代表大腦給了您一段安靜的獨處時光。不用勉強躺著，起來喝杯溫水、深呼吸、聽聽清晨第一聲鳥叫，享受這份沒有人打擾的平靜。",
    "常常轉頭就忘記東西放哪，擔心自己記性退化": "記性偶爾打結很正常，這不是退化，而是您的腦袋這輩子裝了太多豐富的人生智慧，偶爾在整理倉庫呢！換個角度想，多給自己一個會心的微笑，慢慢找就好，不用急！",
    "天氣不好下大雨，只能整天關在家裡好無聊": "下雨天不能出門散步，但換個角度看，老天爺正為大地洗塵，也給了您一個不受打擾的休養時光。在家泡杯熱茶、看看電視或做個伸展，也是專屬於自己的品味時刻！",
    "鄰居或朋友講話酸言酸語，聽了心裡很不開心": "聽到不中聽的話難免刺耳，但換個角度看，別人講話酸往往反映是他自己內心有不安或不滿。這正是練習『寬恕與放下』的好機會，把注意力收回給珍惜您的人，心情自然海闊天空！",
    "每天日子好像都差不多，感覺生活沒什麼特別目標": "日子看似平淡，但換個角度看，『平安、無事、規律』其實是人間最難得的福氣。今天能來社區上課、認識朋友、學新東西，您已經踏出了非常精彩又充實的一步！"
  };

  function selectTag(element, text) {
    document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('userInput').value = text;
  }

  function getReframing() {
    const input = document.getElementById('userInput').value.trim();
    if (!input) {
      alert("請先點選上方其中一個煩惱卡片，或自己在框框輸入喔！");
      return;
    }

    const btn = document.getElementById('btnSubmit');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    btn.disabled = true;
    btn.innerText = "助教正在換角度思考中...";
    resultBox.style.display = "none";

    setTimeout(() => {
      let reply = presetReplies[input];
      if (!reply) {
        reply = `這件事確實會讓人心裡有些悶悶的。但換個角度看，事情已經發生了，而您今天願意打開心胸提出來覺察，代表您擁有一顆非常有智慧且願意轉念的心。試著想想看，這件事裡有沒有哪個微小的地方，是值得感謝或讓自己學到智慧的呢？`;
      }

      resultText.innerText = reply;
      resultBox.style.display = "block";
      btn.disabled = false;
      btn.innerText = "請 AI 助教換角度看 ➔";

      speakResult();
    }, 800);
  }

  function speakResult() {
    const text = document.getElementById('resultText').innerText;
    if ('speechSynthesis' in window && text) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    }
  }
</script>
</body>
</html>
